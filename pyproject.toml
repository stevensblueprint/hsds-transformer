[project]
name = "hsds-transformer"
version = "0.1.0"
description = "Convert almost resource data into Human Services Data Specification (HSDS) compliant format."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "glom==24.11.0",
    "click==8.2.1",
    "requests>=2.33.0,<3",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
api = [
    "fastapi>=0.143.0,<1",
    "uvicorn>=0.35.0,<1",
    "python-multipart>=0.0.31,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]
audit = [
    "pip-audit==2.10.1",
]

[tool.uv]
required-version = "==0.11.21"

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff.lint]
# Preserve the pre-0.16 defaults; adopt broader rules in a separate cleanup.
select = ["E4", "E7", "E9", "F"]
