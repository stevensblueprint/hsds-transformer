name: Publish HSDS Container to ECR
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  baseline:
    uses: ./.github/workflows/baseline.yml
  deploy:
    # Manual runs may only publish main; all runs must pass their own baseline.
    if: github.ref == 'refs/heads/main'
    needs: baseline
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baseline-image
          path: ${{ runner.temp }}
      - name: Load tested image
        run: docker load -i "$RUNNER_TEMP/baseline-image.tar"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-ecr-deployer-hsds-transformer
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/hsds-transformer
        run: |
          docker tag "hsds-baseline:${{ github.sha }}" "$IMAGE:${{ github.sha }}"
          docker tag "hsds-baseline:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}" | tee "$RUNNER_TEMP/push.log"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:${{ github.sha }} from tested commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/push.log" >> "$GITHUB_STEP_SUMMARY"
