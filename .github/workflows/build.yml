name: Build and publish Docker image
on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  baseline:
    uses: ./.github/workflows/baseline.yml
  docker:
    needs: baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baseline-image
          path: ${{ runner.temp }}
      - name: Load tested image
        run: docker load -i "$RUNNER_TEMP/baseline-image.tar"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE: ghcr.io/stevensblueprint/openreferral
        run: |
          docker tag "hsds-baseline:${{ github.sha }}" "$IMAGE:${{ github.sha }}"
          docker tag "hsds-baseline:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}" | tee "$RUNNER_TEMP/push.log"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:${{ github.sha }} from tested commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/push.log" >> "$GITHUB_STEP_SUMMARY"
