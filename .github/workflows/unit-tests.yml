name: Transformer Unit Tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Sync locked dependencies
        run: uv sync --locked --extra api
      - name: Run unit tests
        run: uv run --locked --extra api python -m pytest tests/ -v
