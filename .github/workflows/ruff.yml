name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Sync locked dependencies
        run: uv sync --locked --no-default-groups --group dev
      - name: Run Ruff
        run: uv run --locked --no-default-groups --group dev ruff check --output-format=github .
